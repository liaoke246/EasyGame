<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24272b" />
    <meta
      name="description"
      content="方块危机是一款轻量的多人在线俯视角僵尸生存游戏。"
    />
    <title>方块危机 · Block Crisis</title>
  </head>
  <body>
    <main id="app">
      <section id="login-screen" class="login-screen" aria-labelledby="game-title">
        <div class="sky-glow" aria-hidden="true"></div>
        <div class="login-landscape" aria-hidden="true">
          <span class="hill hill--back"></span>
          <span class="hill hill--front"></span>
          <span class="pixel-tree pixel-tree--one"></span>
          <span class="pixel-tree pixel-tree--two"></span>
          <span class="pixel-cabin"></span>
        </div>

        <div class="login-card">
          <p class="eyebrow">TOP-DOWN CO-OP SURVIVAL</p>
          <h1 id="game-title">方块危机</h1>
          <p class="title-en">BLOCK CRISIS</p>
          <p class="intro">
            进入方块竞技场，和其他玩家一起用三种无限弹药武器抵御不断逼近的尸潮。
          </p>

          <div class="login-features" aria-label="游戏特色">
            <span><b>01</b> 随机身份</span>
            <span><b>02</b> 实时联机</span>
            <span><b>03</b> 僵尸生存</span>
          </div>

          <button id="enter-button" class="enter-button" type="button">
            进入竞技场
            <span aria-hidden="true">→</span>
          </button>
          <div
            id="loading-panel"
            class="loading-panel is-hidden"
            role="progressbar"
            aria-label="游戏资源加载进度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="loading-copy">
              <span id="loading-label">准备游戏资源</span>
              <strong id="loading-progress-value">0%</strong>
            </div>
            <div class="loading-track" aria-hidden="true">
              <span id="loading-progress-fill"></span>
            </div>
            <small id="loading-file">正在连接生存服务器…</small>
          </div>
          <p id="login-status" class="login-status" aria-live="polite">
            无需注册 · 身份会保存在此设备
          </p>
        </div>
      </section>

      <section id="game-shell" class="game-shell is-hidden" aria-label="游戏画面">
        <div id="game" class="game-canvas"></div>

        <header class="top-hud">
          <div class="profile-card">
            <div id="player-portrait" class="player-portrait" aria-hidden="true">
              <span class="portrait-hat"></span>
              <span class="portrait-face"></span>
              <span class="portrait-body"></span>
            </div>
            <div class="profile-copy">
              <strong id="player-id">旅人-0000</strong>
              <span id="player-role">生存者</span>
              <div class="health-row">
                <div class="health-track" aria-label="生命值">
                  <span id="hud-health-fill" data-level="healthy"></span>
                </div>
                <small id="health-value">100 / 100</small>
              </div>
            </div>
          </div>

          <div class="world-stats">
            <div class="online-stat">
              <span class="status-dot" aria-hidden="true"></span>
              <small>在线</small>
              <strong id="online-count">1</strong>
            </div>
            <i class="combat-separator" aria-hidden="true"></i>
            <div class="combat-stat">
              <small>僵尸 / 清除</small>
              <strong><span id="zombie-count">0</span> / <span id="kill-count">0</span></strong>
            </div>
            <i class="network-separator" aria-hidden="true"></i>
            <div class="network-stat" title="实时往返延迟与最近 20 次探针超时率">
              <small>
                <span id="connection-dot" class="status-dot" data-state="offline" aria-hidden="true"></span>
                网络
              </small>
              <strong>
                <span id="latency-value">--</span> ms ·
                <span id="packet-loss-value">--</span>% lost
              </strong>
            </div>
          </div>
        </header>

        <aside id="event-feed" class="event-feed" aria-live="polite"></aside>

        <div id="respawn-message" class="respawn-message" role="status">
          <strong>暂时倒下了</strong>
          <span>正在返回竞技场…</span>
        </div>

        <nav class="weapon-bar" aria-label="武器选择">
          <button type="button" data-weapon="smg" class="is-selected">
            <kbd>1</kbd><span>冲锋枪</span><small>∞</small>
          </button>
          <button type="button" data-weapon="shotgun">
            <kbd>2</kbd><span>喷子</span><small>∞</small>
          </button>
          <button type="button" data-weapon="rocket">
            <kbd>3</kbd><span>火箭筒</span><small>∞</small>
          </button>
        </nav>

        <footer class="desktop-controls">
          <span><kbd>WASD</kbd> / <kbd>方向键</kbd> 移动</span>
          <i aria-hidden="true"></i>
          <span><kbd>空格</kbd> 射击 · 当前 <b id="current-weapon">冲锋枪</b></span>
        </footer>

        <div class="touch-controls" aria-label="触摸控制">
          <div class="touch-dpad">
            <button type="button" data-move="up" aria-label="向上移动">↑</button>
            <button type="button" data-move="left" aria-label="向左移动">←</button>
            <button type="button" data-move="down" aria-label="向下移动">↓</button>
            <button type="button" data-move="right" aria-label="向右移动">→</button>
          </div>
          <button id="touch-attack" class="touch-attack" type="button" aria-label="攻击">
            <span aria-hidden="true">⚔</span>
            <b id="touch-weapon-name">冲锋枪</b>
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
