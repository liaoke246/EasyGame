name: Deploy EasyGame

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: easygame-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble game lobby and verified Unity WebGL releases
        run: npm run build:web-release

      - name: Verify Unity client structures
        run: npm run test:unity && npm run test:side-scroller

      - name: Run gameplay regression tests
        run: npm run test:animation && npm run test:combat && npm run test:smoke

      - name: Verify Mirror Linux server release
        run: test -x unity-side-scroller/PrebuiltServerLinux/DeadRailsServer.x86_64

      - name: Package release
        run: |
          tar -czf "easygame-${GITHUB_SHA}.tar.gz" \
            package.json package-lock.json \
            client/package.json client/dist \
            server/package.json server/dist \
            shared/package.json shared/dist \
            unity-side-scroller/PrebuiltServerLinux

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/easygame
          chmod 600 ~/.ssh/easygame
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i ~/.ssh/easygame -P "$SERVER_PORT" \
            "easygame-${GITHUB_SHA}.tar.gz" \
            "$SERVER_USER@$SERVER_HOST:/tmp/easygame-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/easygame -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$GITHUB_SHA' '/tmp/easygame-$GITHUB_SHA.tar.gz'" \
            < scripts/deploy-server.sh
