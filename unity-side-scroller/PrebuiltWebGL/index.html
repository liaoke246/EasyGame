<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#091016">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>EasyGame Dead Rails</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #091016; touch-action: manipulation; }
    [hidden] { display: none !important; }
    button, input { font: inherit; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; background: #091016; outline: 0; }
    #profile-setup, #loader { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #1c3a3e, #091016 66%); }
    #profile-setup { z-index: 30; overflow: auto; padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); touch-action: pan-y; }
    #unity-canvas, #profile-setup, #loader, #mobile-controls { top: var(--app-top, 0px); bottom: auto; height: var(--app-height, 100dvh); }
    #unity-canvas, .control { touch-action: none; }
    #profile-setup { display: flex; }
    #profile-setup .profile-card { flex-shrink: 0; margin: auto; }
    .profile-card { width: min(760px, 100%); padding: clamp(22px, 4vw, 38px); border: 1px solid rgba(229,198,113,.4); border-radius: 20px; background: rgba(7,15,20,.94); box-shadow: 0 28px 100px rgba(0,0,0,.56); }
    .eyebrow { color: #d7bc71; font-size: 12px; font-weight: 900; letter-spacing: .2em; }
    h1 { margin: 8px 0 5px; font-size: clamp(26px, 5vw, 44px); }
    .intro { margin: 0 0 22px; color: #9eaaa6; font-size: 14px; }
    .field-label { display: block; margin: 0 0 8px; color: #dce6e2; font-size: 13px; font-weight: 800; }
    #player-name { width: 100%; height: 48px; padding: 0 14px; border: 1px solid rgba(255,255,255,.22); border-radius: 10px; outline: none; color: #fff; background: rgba(255,255,255,.07); touch-action: manipulation; }
    #player-name:focus { border-color: #58c9aa; box-shadow: 0 0 0 3px rgba(88,201,170,.14); }
    .choose-label { margin-top: 20px; }
    .avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .avatar-option { min-height: 126px; padding: 16px 10px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; color: #dce6e2; background: rgba(255,255,255,.035); cursor: pointer; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
    .avatar-option:hover { transform: translateY(-2px); border-color: rgba(229,198,113,.5); }
    .avatar-option.selected { border-color: #e5c671; color: #fff6cf; background: linear-gradient(145deg, rgba(229,198,113,.19), rgba(71,160,138,.12)); box-shadow: inset 0 0 0 1px rgba(229,198,113,.22); }
    .avatar-icon { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 9px; border: 2px solid currentColor; border-radius: 8px; font-size: 23px; font-weight: 900; image-rendering: pixelated; }
    .avatar-option[data-avatar="slime"] .avatar-icon { height: 34px; margin-top: 14px; border-radius: 50% 50% 9px 9px; color: #70d6ef; }
    .avatar-name { display: block; font-weight: 900; }
    .avatar-note { display: block; margin-top: 4px; color: #8fa19a; font-size: 11px; }
    #start-game { width: 100%; height: 50px; margin-top: 20px; border: 1px solid #efd77e; border-radius: 12px; color: #10201c; background: linear-gradient(135deg, #f1d878, #58c9aa); font-weight: 1000; cursor: pointer; }
    #start-game:active { transform: translateY(1px); }
    #loader { z-index: 20; transition: opacity .35s ease; }
    .loader-card { width: min(430px, calc(100vw - 42px)); padding: 30px; border: 1px solid rgba(229,198,113,.36); border-radius: 16px; background: rgba(7,15,20,.88); box-shadow: 0 24px 80px rgba(0,0,0,.48); }
    .loader-card h1 { margin-bottom: 18px; }
    .track { height: 6px; overflow: hidden; border-radius: 10px; background: #1d2a2f; }
    #progress { width: 0; height: 100%; background: linear-gradient(90deg,#51c7a6,#e5c671); transition: width .18s ease; }
    #status { margin-top: 12px; color: #9eaaa6; font-size: 12px; }
    #retry-load { margin-top: 18px; padding: 10px 16px; border: 1px solid #e5c671; border-radius: 8px; color: #fff6cf; background: #243b36; cursor: pointer; }
    #back { position: fixed; z-index: 10; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 8px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; color: #e9e7de; background: rgba(5,12,16,.64); text-decoration: none; backdrop-filter: blur(10px); }
    #mobile-controls { display: none; position: fixed; inset: 0; z-index: 9; pointer-events: none; }
    .control { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); width: clamp(58px, 17vw, 86px); height: clamp(58px, 17vw, 86px); border: 1px solid rgba(229,198,113,.48); border-radius: 50%; color: #fff; background: rgba(11,22,26,.58); font-size: 22px; font-weight: 900; pointer-events: auto; user-select: none; -webkit-user-select: none; }
    #left { left: max(16px, env(safe-area-inset-left)); }
    #right { left: calc(max(16px, env(safe-area-inset-left)) + clamp(70px, 20vw, 100px)); }
    #jump { right: max(16px, env(safe-area-inset-right)); color: #12201d; background: rgba(91,213,178,.8); }
    #attack { right: calc(max(16px, env(safe-area-inset-right)) + clamp(70px, 20vw, 100px)); }
    #skills { display: none; position: fixed; z-index: 10; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); gap: 7px; }
    body.game-ready #skills { display: flex; }
    .skill { position: relative; width: 98px; height: 54px; border: 1px solid #60c9bc; border-radius: 8px; background: #10292beb; color: #e0fff2; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
    .skill:nth-child(2) { border-color: #a195ee; }
    .skill:nth-child(3) { border-color: #edb053; }
    .skill strong, .skill span { display: block; position: relative; z-index: 1; }
    .skill strong { font-size: 12px; } .skill span { font-size: 11px; margin-top: 4px; }
    .skill::before { content: ''; position: absolute; inset: 0; background: #03090ccc; transform-origin: bottom; transform: scaleY(var(--cooldown, 0)); border-radius: 7px; pointer-events: none; }
    .skill[aria-disabled="true"] { color: #9daaa9; }
    @media (pointer: coarse), (max-width: 900px) {
      #skills { left: auto; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + clamp(58px, 17vw, 86px) + 12px); transform: none; gap: 6px; }
      .skill { width: 56px; height: 52px; }
      .skill strong { font-size: 10px; white-space: nowrap; }
    }
    @media (pointer: coarse), (max-width: 900px) { body.game-ready #mobile-controls { display: block; } #back { font-size: 12px; } }
    @media (max-width: 620px) { .profile-card { padding: 20px; } .avatar-grid { gap: 7px; } .avatar-option { min-height: 112px; padding: 12px 6px; } .avatar-note { display: none; } }
    @media (orientation: portrait) { .control { bottom: max(28px, env(safe-area-inset-bottom)); } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <a id="back" href="/">← 游戏大厅</a>
  <section id="profile-setup" aria-labelledby="setup-title">
    <form class="profile-card" id="profile-form">
      <div class="eyebrow">EASYGAME // PLAYER PROFILE</div>
      <h1 id="setup-title">进入森林前线</h1>
      <p class="intro">选择角色探索森林。J 普攻 · K 裂风斩 · L 升龙击 · U 裂地波（落地施放）。怪物红色蓄力提示出现时，移动或跳跃躲开。</p>
      <label class="field-label" for="player-name">玩家名字（英文、数字、空格）</label>
      <input id="player-name" name="playerName" maxlength="14" pattern="[A-Za-z0-9 _\-]{1,14}" title="请输入 1–14 位英文、数字、空格、下划线或短横线" autocomplete="nickname" enterkeyhint="go" placeholder="PLAYER-2048" required>
      <div class="field-label choose-label">选择角色</div>
      <div class="avatar-grid" role="radiogroup" aria-label="角色选择">
        <button class="avatar-option selected" type="button" data-avatar="warrior" role="radio" aria-checked="true">
          <span class="avatar-icon">⚔</span><span class="avatar-name">男战士</span><span class="avatar-note">完整近战动作组</span>
        </button>
        <button class="avatar-option" type="button" data-avatar="female" role="radio" aria-checked="false">
          <span class="avatar-icon">♀</span><span class="avatar-name">女游侠</span><span class="avatar-note">独立女性动作组</span>
        </button>
        <button class="avatar-option" type="button" data-avatar="slime" role="radio" aria-checked="false">
          <span class="avatar-icon">●</span><span class="avatar-name">蓝史莱姆</span><span class="avatar-note">弹跳式移动与攻击</span>
        </button>
      </div>
      <button id="start-game" type="submit">连接服务器并开始</button>
    </form>
  </section>
  <div id="mobile-controls" aria-label="手机操作">
    <button id="left" class="control" aria-label="向左">◀</button>
    <button id="right" class="control" aria-label="向右">▶</button>
    <button id="attack" class="control" aria-label="攻击">ATK</button>
    <button id="jump" class="control" aria-label="跳跃">JUMP</button>
  </div>
  <div id="skills" aria-label="角色技能">
    <button id="skill1" class="skill" aria-label="裂风斩"><strong>K 裂风斩</strong><span>就绪</span></button>
    <button id="skill2" class="skill" aria-label="升龙击"><strong>L 升龙击</strong><span>就绪</span></button>
    <button id="skill3" class="skill" aria-label="裂地波"><strong>U 裂地波</strong><span>就绪</span></button>
  </div>
  <div id="loader" hidden>
    <div class="loader-card">
      <div class="eyebrow">EASYGAME // 2D CO-OP</div>
      <h1>Dead Rails</h1>
      <div class="track"><div id="progress"></div></div>
      <div id="status" aria-live="polite">正在装载横版生存区…</div>
      <button id="retry-load" type="button" hidden>重新加载游戏</button>
    </div>
  </div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const setup = document.querySelector("#profile-setup");
    const form = document.querySelector("#profile-form");
    const nameInput = document.querySelector("#player-name");
    const avatarButtons = [...document.querySelectorAll(".avatar-option")];
    const loader = document.querySelector("#loader");
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const retryLoad = document.querySelector("#retry-load");
    const buildUrl = "Build";
    const releaseVersion = "0.5.0";
    const pageUrl = new URL(window.location.href);
    // Private browsing and storage policies can reject access even on reads.
    function readPreference(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }
    function savePreference(key, value) {
      try { localStorage.setItem(key, value); } catch { /* The current session still works. */ }
    }
    function cleanName(value) { return String(value || "").replace(/[^A-Za-z0-9_\- ]/g, "").trim().slice(0, 14).trim(); }
    let selectedAvatar = pageUrl.searchParams.get("avatar") || readPreference("easygame-2d-avatar") || "warrior";
    let unityInstance = null;
    let gameStarting = false;
    nameInput.value = cleanName(pageUrl.searchParams.get("playerName") || readPreference("easygame-2d-name")) || `PLAYER-${Math.floor(1000 + Math.random() * 9000)}`;

    function resizeViewport() {
      const viewport = window.visualViewport;
      document.documentElement.style.setProperty("--app-height", `${Math.round(viewport ? viewport.height : window.innerHeight)}px`);
      document.documentElement.style.setProperty("--app-top", `${Math.round(viewport ? viewport.offsetTop : 0)}px`);
    }
    window.addEventListener("resize", resizeViewport);
    window.addEventListener("orientationchange", resizeViewport);
    window.visualViewport?.addEventListener("resize", resizeViewport);
    window.visualViewport?.addEventListener("scroll", resizeViewport);
    resizeViewport();

    function selectAvatar(value) {
      selectedAvatar = ["warrior", "female", "slime"].includes(value) ? value : "warrior";
      avatarButtons.forEach(button => {
        const selected = button.dataset.avatar === selectedAvatar;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-checked", String(selected));
      });
    }
    avatarButtons.forEach(button => button.addEventListener("click", () => selectAvatar(button.dataset.avatar)));
    selectAvatar(selectedAvatar);

    function sendMobileControl(control, pressed) {
      if (unityInstance) unityInstance.SendMessage("SideScroller Game", "SetMobileControl", `${control}:${pressed ? 1 : 0}`);
    }
    const releaseControls = [];
    function resetControls() {
      releaseControls.forEach(release => release());
      sendMobileControl("reset", true);
    }
    function bindHold(id, control) {
      const button = document.querySelector(id);
      const pointers = new Set();
      const release = () => {
        const captured = [...pointers];
        pointers.clear();
        if (captured.length) sendMobileControl(control, false);
        captured.forEach(pointerId => {
          if (button.hasPointerCapture?.(pointerId)) button.releasePointerCapture(pointerId);
        });
      };
      releaseControls.push(release);
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        if (!unityInstance || (event.pointerType === "mouse" && event.button !== 0)) return;
        canvas.focus({ preventScroll: true });
        const wasHeld = pointers.size > 0;
        pointers.add(event.pointerId);
        button.setPointerCapture(event.pointerId);
        if (!wasHeld) sendMobileControl(control, true);
      });
      const up = event => {
        event.preventDefault();
        if (!pointers.delete(event.pointerId)) return;
        if (!pointers.size) sendMobileControl(control, false);
        if (button.hasPointerCapture?.(event.pointerId)) button.releasePointerCapture(event.pointerId);
      };
      button.addEventListener("pointerup", up);
      button.addEventListener("pointercancel", up);
      button.addEventListener("lostpointercapture", up);
      button.addEventListener("contextmenu", event => event.preventDefault());
    }
    bindHold("#left", "left");
    bindHold("#right", "right");
    bindHold("#jump", "jump");
    bindHold("#attack", "attack");
    bindHold("#skill1", "skill1");
    bindHold("#skill2", "skill2");
    bindHold("#skill3", "skill3");
    window.easygameSkillState = (cleave, rising, nova, defeated) => {
      [cleave, rising, nova].forEach((remaining, index) => {
        const button = document.querySelector(`#skill${index + 1}`);
        const time = Number.isFinite(remaining) ? Math.max(0, remaining) : 0;
        button.style.setProperty("--cooldown", String(Math.min(1, time / [3, 5, 8][index])));
        button.setAttribute("aria-disabled", String(Boolean(defeated) || time > 0));
        button.querySelector("span").textContent = defeated ? "复活中" : time > 0 ? `${time.toFixed(1)}s` : "就绪";
      });
    };
    window.addEventListener("blur", resetControls);
    window.addEventListener("pagehide", resetControls);
    document.addEventListener("visibilitychange", () => { if (document.hidden) resetControls(); });

    function showLoadError(message) {
      status.textContent = "加载失败：" + String(message);
      retryLoad.hidden = false;
    }
    retryLoad.addEventListener("click", () => window.location.reload());

    function startUnity() {
      const loaderUrl = buildUrl + "/PrebuiltWebGL.loader.js?v=" + releaseVersion;
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/PrebuiltWebGL.data.unityweb?v=" + releaseVersion,
        frameworkUrl: buildUrl + "/PrebuiltWebGL.framework.js.unityweb?v=" + releaseVersion,
        codeUrl: buildUrl + "/PrebuiltWebGL.wasm.unityweb?v=" + releaseVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "EasyGame",
        productName: "EasyGame Dead Rails",
        productVersion: "0.5.0",
      };
      const script = document.createElement("script");
      script.src = loaderUrl;
      let loadTimeout = setTimeout(() => showLoadError("下载时间过长，请检查网络后重试。"), 90000);
      const fail = message => { clearTimeout(loadTimeout); showLoadError(message); };
      script.onerror = () => fail("游戏启动文件未能下载，请检查网络后重试。");
      script.onload = () => Promise.resolve().then(() => createUnityInstance(canvas, config, value => {
        clearTimeout(loadTimeout);
        loadTimeout = setTimeout(() => showLoadError("装载暂时没有进展，可以重新加载。"), 90000);
        progress.style.width = Math.round(value * 100) + "%";
        status.textContent = `正在装载横版生存区… ${Math.round(value * 100)}%`;
      })).then(instance => {
        clearTimeout(loadTimeout);
        unityInstance = instance;
        document.body.classList.add("game-ready");
        loader.style.opacity = "0";
        setTimeout(() => loader.remove(), 380);
        canvas.focus();
      }).catch(fail);
      document.body.appendChild(script);
    }

    function beginGame() {
      if (gameStarting) return;
      const playerName = cleanName(nameInput.value);
      if (!playerName) { nameInput.focus(); return; }
      gameStarting = true;
      savePreference("easygame-2d-name", playerName);
      savePreference("easygame-2d-avatar", selectedAvatar);
      pageUrl.searchParams.set("playerName", playerName);
      pageUrl.searchParams.set("avatar", selectedAvatar);
      try { history.replaceState(null, "", pageUrl); }
      catch {
        // Unity reads this URL for the profile; navigate if history is blocked.
        pageUrl.searchParams.set("autostart", "1");
        window.location.assign(pageUrl.href);
        return;
      }
      setup.hidden = true;
      loader.hidden = false;
      startUnity();
    }
    form.addEventListener("submit", event => { event.preventDefault(); beginGame(); });
    if (pageUrl.searchParams.get("autostart") === "1") beginGame();
  </script>
</body>
</html>
